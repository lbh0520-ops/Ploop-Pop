<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물방구와 활방구로 배우는 중중모리장단</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Jua, Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            color: #f8fafc;
            /* Prevent unwanted tablet gestures and selection during fast tapping */
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        /* Custom Glowing & Touch Active Effect */
        .btn-water-right {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            box-shadow: 0 8px 20px -4px rgba(6, 182, 212, 0.5);
        }
        .btn-water-left {
            background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
            box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.5);
        }
        .btn-bow {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            box-shadow: 0 8px 20px -4px rgba(236, 72, 153, 0.5);
        }
        .btn-active-touch {
            transform: scale(0.94) !important;
            filter: brightness(1.2);
        }
        .beat-active {
            transform: scale(1.15);
            border-color: #f59e0b !important;
            background-color: rgba(245, 158, 11, 0.25) !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 md:p-8 min-h-screen select-none">

    <!-- Header -->
    <header class="text-center my-4 max-w-2xl">
        <h1 class="text-3xl md:text-5xl font-jua text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-300 to-pink-400 mb-2">
            💨 Ploop & Bow: Jungjoongmori 🎶
        </h1>
        <p class="text-slate-300 text-xs md:text-sm">
            물방구(오른손/왼손)와 활방구(슉~!)를 동시에 터치하여 <b>중중모리장단</b>(12박)을 연주해봅시다!
        </p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-4xl bg-slate-800/80 backdrop-blur-md rounded-3xl p-5 md:p-8 border border-slate-700 shadow-2xl space-y-6">

        <!-- Rhythm Visualizer (12 Beats) -->
        <section>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg md:text-xl font-jua text-yellow-400 flex items-center gap-2">
                    <i class="fa-solid fa-drum"></i> 중중모리장단 (12소박)
                </h2>
            </div>

            <!-- Beats Grid -->
            <div class="grid grid-cols-4 md:grid-cols-12 gap-2 text-center" id="beatGrid">
                <!-- Javascript will populate 12 beat cards here -->
            </div>
            
            <div class="mt-3 text-[11px] text-slate-400 flex justify-between px-1">
                <span>1소박 (오+왼 / 덩)</span>
                <span>2소박 (덕)</span>
                <span>3소박 (쿵)</span>
                <span>4소박 (덕)</span>
            </div>
        </section>

        <!-- Pad Controls for Manual Play (Multi-touch Optimized) -->
        <section class="grid grid-cols-3 gap-3 md:gap-5 touch-none">
            
            <!-- Left Hand Water Fart -->
            <button id="moolLeftBtn" class="btn-water-left rounded-2xl p-4 md:p-6 text-center transition-transform cursor-pointer flex flex-col items-center justify-center gap-2 group select-none">
                <div class="w-12 h-12 md:w-16 md:h-16 bg-white/20 rounded-full flex items-center justify-center text-2xl md:text-3xl pointer-events-none">
                    👈
                </div>
                <div class="pointer-events-none">
                    <h3 class="text-base md:text-xl font-jua text-white">물방구 (왼손)</h3>
                    <p class="text-blue-100 text-[11px] mt-0.5">낮은 쿵 소리</p>
                </div>
                <span class="text-[10px] bg-black/30 text-blue-200 px-2 py-0.5 rounded-full pointer-events-none">A / ←</span>
            </button>

            <!-- Right Hand Water Fart -->
            <button id="moolRightBtn" class="btn-water-right rounded-2xl p-4 md:p-6 text-center transition-transform cursor-pointer flex flex-col items-center justify-center gap-2 group select-none">
                <div class="w-12 h-12 md:w-16 md:h-16 bg-white/20 rounded-full flex items-center justify-center text-2xl md:text-3xl pointer-events-none">
                    👉
                </div>
                <div class="pointer-events-none">
                    <h3 class="text-base md:text-xl font-jua text-white">물방구 (오른손)</h3>
                    <p class="text-cyan-100 text-[11px] mt-0.5">높은 퐁당 소리</p>
                </div>
                <span class="text-[10px] bg-black/30 text-cyan-200 px-2 py-0.5 rounded-full pointer-events-none">D / →</span>
            </button>

            <!-- Bow Fart Pad -->
            <button id="hwalBtn" class="btn-bow rounded-2xl p-4 md:p-6 text-center transition-transform cursor-pointer flex flex-col items-center justify-center gap-2 group select-none">
                <div class="w-12 h-12 md:w-16 md:h-16 bg-white/20 rounded-full flex items-center justify-center text-2xl md:text-3xl pointer-events-none">
                    🎻
                </div>
                <div class="pointer-events-none">
                    <h3 class="text-base md:text-xl font-jua text-white">활방구</h3>
                    <p class="text-pink-100 text-[11px] mt-0.5">날카로운 마찰음 (│)</p>
                </div>
                <span class="text-[10px] bg-black/30 text-pink-200 px-2 py-0.5 rounded-full pointer-events-none">S / ↓</span>
            </button>

        </section>

    </main>

    <!-- Guide Footer -->
    <footer class="mt-4 text-center text-[11px] text-slate-400 space-y-1">
        <p>💡 <b>태블릿 사용 팁:</b> 왼손과 오른손, 활방구 버튼을 손가락 여러 개로 동시에 터치하여 연주할 수 있습니다.</p>
        <p>© 2026 Ploop & Bow: Jungjoongmori Studio</p>
    </footer>

    <!-- Audio Synthesis & Logic Script -->
    <script>
        // Web Audio Context initialization
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- Polyphony Sound Synthesizers ---
        // Base Moolbanggoo sound renderer with pitch modifier
        function createMoolSound(baseFreq, sweepFreq, decayTime) {
            initAudio();
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseFreq, now);
            osc.frequency.exponentialRampToValueAtTime(sweepFreq, now + 0.07);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.7, now + decayTime);

            gain.gain.setValueAtTime(0.8, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + decayTime);

            // Water bubble noise burst
            const bufferSize = audioCtx.sampleRate * 0.08;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.value = sweepFreq * 2.5;

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.25, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + decayTime);
            noise.start(now);
            noise.stop(now + 0.08);
        }

        // 1. Right Hand (오) - Higher pitch pop
        function playMoolRight() {
            createMoolSound(110, 420, 0.2);
            animateButton('moolRightBtn');
        }

        // 2. Left Hand (왼) - Medium-low pitch
        function playMoolLeft() {
            createMoolSound(80, 280, 0.25);
            animateButton('moolLeftBtn');
        }

        // 3. Bow Fart Sound (활방구) - Sawtooth friction + Buzz effect
        function playHwal() {
            initAudio();
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sawtooth';
            
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.linearRampToValueAtTime(90, now + 0.15);
            osc.frequency.linearRampToValueAtTime(120, now + 0.2);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.Q.value = 8;

            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.2);

            animateButton('hwalBtn');
        }

        function animateButton(id) {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.classList.add('btn-active-touch');
            setTimeout(() => btn.classList.remove('btn-active-touch'), 120);
        }

        // --- Multi-touch Pointer Event Listeners ---
        function attachMultiTouchHandlers() {
            const bindTouch = (id, playFn) => {
                const elem = document.getElementById(id);
                if (!elem) return;

                // Handle Pointer Down for Multi-Touch on Tablets & Mobile
                elem.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    playFn();
                });
            };

            bindTouch('moolLeftBtn', playMoolLeft);
            bindTouch('moolRightBtn', playMoolRight);
            bindTouch('hwalBtn', playHwal);
        }

        // Reference Score Pattern for Display Only
        const scorePattern = [
            { type: 'BOTH', name: '오+왼' },
            { type: '-', name: '-' },
            { type: 'RIGHT', name: '오' },
            { type: 'LEFT', name: '왼' },
            { type: 'RIGHT', name: '오' },
            { type: 'RIGHT', name: '오' },
            { type: 'LEFT', name: '왼' },
            { type: 'LEFT', name: '왼' },
            { type: 'RIGHT', name: '오' },
            { type: 'LEFT', name: '왼' },
            { type: '-', name: '-' },
            { type: 'LEFT', name: '왼' }
        ];

        // Render 12 Beat Visual Cards
        function renderBeats() {
            const grid = document.getElementById('beatGrid');
            grid.innerHTML = '';

            scorePattern.forEach((beat, index) => {
                const card = document.createElement('div');
                card.id = `beat-${index}`;
                
                let bgClass = 'bg-slate-700/50 border-slate-600 text-slate-400';
                let mainText = '-';
                let bowIndicator = '│'; // Bow mark from score
                
                if (beat.type === 'BOTH') {
                    bgClass = 'bg-purple-900/60 border-purple-400 text-yellow-300 font-bold';
                    mainText = '양';
                } else if (beat.type === 'RIGHT') {
                    bgClass = 'bg-teal-900/50 border-teal-400 text-teal-200 font-bold';
                    mainText = '오';
                } else if (beat.type === 'LEFT') {
                    bgClass = 'bg-indigo-900/50 border-indigo-400 text-indigo-200 font-bold';
                    mainText = '왼';
                } else {
                    bowIndicator = ''; // Rest
                }

                card.className = `border-2 rounded-xl p-2 flex flex-col items-center justify-between transition-all duration-100 min-h-[85px] ${bgClass}`;
                
                card.innerHTML = `
                    <span class="text-[10px] opacity-60 text-slate-300">${index + 1}박</span>
                    <div class="text-lg font-jua my-1">${mainText}</div>
                    <div class="text-xs font-bold text-pink-400">${bowIndicator}</div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') {
                playMoolRight();
            } else if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') {
                playMoolLeft();
            } else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') {
                playHwal();
            }
        });

        // Initial Load
        window.onload = () => {
            renderBeats();
            attachMultiTouchHandlers();
        };
    </script>
</body>
</html>
